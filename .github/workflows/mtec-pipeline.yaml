name: "CI/CD Deployment Pipeline"

on:
  push:
    branches:
      - main
    # FIX: Triggers on any application configuration or infrastructure change
    paths:
      - 'ecommerce-app/**'

env:
  AWS_REGION: "ap-south-1" 
  EKS_CLUSTER_NAME: "mtec-EKS" # FIX: Aligned perfectly to your main.tf definition
  ECR_BACKEND_REPO: "ecommerce-backend"
  ECR_FRONTEND_REPO: "ecommerce-frontend"

jobs:
  # ----------------------------------------------------
  # STAGE 1: Infrastructure Provisioning (Terraform)
  # ----------------------------------------------------
  terraform:
    name: "Terraform Provisioning"
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./terraform

    outputs:
      # Maps the dynamic database output so downstream jobs can read it
      rds_endpoint: ${{ steps.tf-output.outputs.RDS_ENDPOINT }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"
          terraform_wrapper: false # Must be false to grab outputs correctly

      - name: Terraform Core Workflow
        run: |
          terraform init -upgrade
          terraform fmt
          terraform plan
          terraform apply -auto-approve
      - name: Debug Kubernetes on Failure
        if: failure() # This makes sure it only runs if Terraform fails
        run: |
          # 1. Connect GitHub runner to your EKS cluster
          aws eks update-kubeconfig --region ap-south-1 --name mtec-EKS
          
          # 2. Get the status of the Load Balancer Controller pods
          echo "=== POD STATUS ==="
          kubectl get pods -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller
          
          # 3. Get detailed lifecycle events for the deployment
          echo "=== DEPLOYMENT DETAILS ==="
          kubectl describe deployment aws-load-balancer-controller -n kube-system
          
          # 4. Print the actual error logs from the container
          echo "=== POD LOGS ==="
          kubectl logs -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller --tail=50 || true

      - name: Extract Database Endpoint
        id: tf-output
        run: |
          # Extracts the raw connection address generated by AWS RDS
          DB_END=$(terraform output -raw rds_endpoint | cut -d':' -f1)
          echo "RDS_ENDPOINT=$DB_END" >> $GITHUB_OUTPUT

  # ----------------------------------------------------
  # STAGE 2: Build Images & Push to AWS ECR
  # ----------------------------------------------------
  build-and-push:
    name: "Build & Push to ECR"
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # FIX: Automatically injects the live database address into your application
      - name: Inject Dynamic Database Endpoint
        run: |
          find . -type f \( -name "*.go" -o -name "*.py" -o -name "*.js" -o -name "*.json" -o -name "*.env" -o -name "*.yaml" -o -name "*.yml" \) -exec sed -i 's|://amazonaws.com|://${{ needs.terraform.outputs.rds_endpoint }}|g' {} +
          echo "Dynamic RDS Endpoint Injected: ${{ needs.terraform.outputs.rds_endpoint }}"

      - name: Build, Tag, and Push Backend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_BACKEND_REPO:latest ./ecommerce-app/backend
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPO:latest

      - name: Build, Tag, and Push Frontend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_FRONTEND_REPO:latest ./ecommerce-app/frontend
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPO:latest

  # ----------------------------------------------------
  # STAGE 3: Deploy to AWS EKS Cluster
  # ----------------------------------------------------
  deploy-to-eks:
    name: "Deploy to EKS"
    needs: [terraform, build-and-push]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./EKS-manifests # Keeps the context inside your k8s folder path

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for EKS Cluster to be Active
        run: |
          echo "Ensuring cluster is active..."
          aws eks wait cluster-active --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Update Kubeconfig for EKS
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Cleanup Stuck Helm Release
        run: |
          helm uninstall aws-load-balancer-controller -n kube-system --no-hooks || true
          kubectl delete secrets -n kube-system -l owner=helm,name=aws-load-balancer-controller --ignore-not-found=true

      - name: Install AWS Load Balancer Controller CRDs
        run: |
          kubectl apply -f https://raw.githubusercontent.com/aws/eks-charts/master/stable/aws-load-balancer-controller/crds/crds.yaml  

      - name: Deploy AWS Load Balancer Controller via Direct Chart Package
        run: |
          # 🟢 Bypasses 'helm repo add' entirely by defining the direct AWS package target version (e.g., v1.7.2)
          CHART_VERSION="1.7.2"
          CHART_URL="https://github.io{CHART_VERSION}.tgz"
          
          echo "Installing controller directly from $CHART_URL..."
          
          # Deploy the controller using the direct download link 
          helm upgrade --install aws-load-balancer-controller "$CHART_URL" \
            -n kube-system \
            --set clusterName=${{ env.EKS_CLUSTER_NAME }} \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller


      - name: Update Image Tags in Deployment Manifests
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          sed -i "s|image: .*ecommerce-backend.*|image: ${AWS_ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}://{{ env.ECR_BACKEND_REPO }}:${{ github.sha }}|g" backend-deployment.yaml
          sed -i "s|image: .*ecommerce-frontend.*|image: ${AWS_ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}://{{ env.ECR_FRONTEND_REPO }}:${{ github.sha }}|g" frontend-deployment.yaml

      - name: Apply Kubernetes Configurations
        run: |
          # REMOVED the redundant 'EKS-manifests/' prefixes since defaults handles it
          kubectl apply -f db-secret.yaml || true
          kubectl apply -f backend-deployment.yaml
          kubectl apply -f frontend-deployment.yaml
          kubectl apply -f ingress.yaml

      - name: Buffer for Container Initialization
        run: sleep 30    

      - name: Capture Live Cluster Diagnostics
        run: |
          echo "=================================================="
          echo " 1. EXACT POD STATUS AND ERROR STATES"
          echo "=================================================="
          kubectl get pods -n default -o wide

          echo "=================================================="
          echo " 2. RECENT EVENTS AND FAILURE ROOT CAUSES"
          echo "=================================================="
          kubectl get events -n default --sort-by='.metadata.creationTimestamp' | tail -n 20

          echo "=================================================="
          echo " 3. BACKEND POD SPECIFIC LIFECYCLE DETAILS"
          echo "=================================================="
          kubectl describe deployment/ecommerce-backend
          echo "=================================================="
          echo " 4. LIVE BACKEND APPLICATION CRASH LOGS"
          echo "=================================================="
          kubectl logs deployment/ecommerce-backend --all-containers=true --tail=100 || echo "Containers haven't started yet."
      
      - name: Verify Load Balancer Pod Status
        run: |
          echo "=== POD STATUS ==="
          kubectl get pods -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller
