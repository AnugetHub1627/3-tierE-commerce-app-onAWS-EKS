name: "CI/CD Deployment Pipeline"

on:
  push:
    branches:
      - main
    # FIX: Triggers on any application configuration or infrastructure change
    paths:
      - 'ecommerce-app/**'

env:
  AWS_REGION: "ap-south-1" 
  EKS_CLUSTER_NAME: "mtec-EKS" # FIX: Aligned perfectly to your main.tf definition
  ECR_BACKEND_REPO: "ecommerce-backend"
  ECR_FRONTEND_REPO: "ecommerce-frontend"

jobs:
  # ----------------------------------------------------
  # STAGE 1: Infrastructure Provisioning (Terraform)
  # ----------------------------------------------------
  terraform:
    name: "Terraform Provisioning"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    outputs:
      # FIX: Maps the dynamic database output so downstream jobs can read it
      rds_endpoint: ${{ steps.tf-output.outputs.RDS_ENDPOINT }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"
          terraform_wrapper: false # FIX: Must be false to grab outputs correctly

      - name: Terraform Core Workflow
        run: |
          terraform init
          terraform fmt
          terraform plan
          terraform apply -auto-approve

      - name: Extract Database Endpoint
        id: tf-output
        run: |
          # FIX: Extracts the raw connection address generated by AWS RDS
          DB_END=$(terraform output -raw rds_endpoint | cut -d':' -f1)
          echo "RDS_ENDPOINT=$DB_END" >> $GITHUB_OUTPUT

  # ----------------------------------------------------
  # STAGE 2: Build Images & Push to AWS ECR
  # ----------------------------------------------------
  build-and-push:
    name: "Build & Push to ECR"
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # FIX: Automatically injects the live database address into your application
      - name: Inject Dynamic Database Endpoint
        run: |
          find . -type f \( -name "*.go" -o -name "*.py" -o -name "*.js" -o -name "*.json" -o -name "*.env" -o -name "*.yaml" -o -name "*.yml" \) -exec sed -i 's|://amazonaws.com|://${{ needs.terraform.outputs.rds_endpoint }}|g' {} +
          echo "Dynamic RDS Endpoint Injected: ${{ needs.terraform.outputs.rds_endpoint }}"

      - name: Build, Tag, and Push Backend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_BACKEND_REPO:latest ./backend
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPO:latest

      - name: Build, Tag, and Push Frontend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_FRONTEND_REPO:latest ./frontend
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPO:latest

  # ----------------------------------------------------
  # STAGE 3: Deploy to AWS EKS Cluster
  # ----------------------------------------------------
  deploy-to-eks:
    name: "Deploy to EKS"
    needs: [terraform, build-and-push]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./k8s # FIX: Pointed to your actual k8s folder path

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Kubeconfig for EKS
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      # FIX: Injects your unique build tag straight into the resource files
      - name: Update Image Tags in Deployment Manifests
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          sed -i "s|image: .*ecommerce-backend.*|image: ${AWS_ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}://{{ env.ECR_BACKEND_REPO }}:${{ github.sha }}|g" backend-deployment.yaml
          sed -i "s|image: .*ecommerce-frontend.*|image: ${AWS_ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}://{{ env.ECR_FRONTEND_REPO }}:${{ github.sha }}|g" frontend-deployment.yaml

      - name: Apply Kubernetes Configurations
        run: |
          kubectl apply -f db-secrets.yaml || true
          kubectl apply -f backend-deployment.yaml
          kubectl apply -f frontend-deployment.yaml
          kubectl apply -f ingress-routing.yaml

      # FIX: Updated resource names to match your precise manifest targets
      - name: Verify Kubernetes Deployment Status
        run: |
          kubectl rollout status deployment/ecommerce-backend
          kubectl rollout status deployment/ecommerce-frontend
