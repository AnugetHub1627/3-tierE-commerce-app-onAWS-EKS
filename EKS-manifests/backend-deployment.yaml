apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-backend
  labels:
    app: ecommerce-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecommerce-backend
  template:
    metadata:
      labels:
        app: ecommerce-backend
    spec:
      containers:
      - name: backend-app
        # Replace this with your actual AWS ECR repository URI for the node backend
        image: //amazonaws.com
        ports:
        - containerPort: 5000 # The port your Node.js app listens on (e.g., 5000 or 3000)
        env:
        # 1. The Database Endpoint generated by your Terraform RDS instance
        - name: DB_HOST
          value: "mtec-database.<random-string>.ap-south-1.rds.amazonaws.com" 
        # 2. The Database Name defined in your main.tf
        - name: DB_NAME
          value: "ecommerce"
        # 3. Injecting User from the Secret
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: mysql-db-secret
              key: DB_USER
        # 4. Injecting Password from the Secret
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-db-secret
              key: DB_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: ecommerce-backend
  ports:
  - protocol: TCP
    port: 80        # Port exposed to the frontend cluster internally
    targetPort: 5000 # Target port mapping to your Node.js container
  type: ClusterIP
